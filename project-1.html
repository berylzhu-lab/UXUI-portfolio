<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emotional Ecosystem</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./assets/images/favicon-64.png?v=20261027b">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32.png?v=20261027b">
  <link rel="apple-touch-icon" href="./assets/images/apple-touch-icon.png?v=20261027b">
  <script>
    // same day/night theme as the main page (night by default)
    (function () {
      var theme = "dark";
      try { theme = localStorage.getItem("theme") || "dark"; } catch (e) { }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  
  <style>
    /* 全局暗黑背景重置，完美契合你主页的深色色调 */
    body {
      background-color: hsl(266, 70%, 97%); /* 默认黑灰色 */
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 顶部导航条：给面试官留一条“生路”返回主页，极其重要！ */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: hsl(0, 0%, 100%); /* 接近 Onyx 的卡片底色 */
      border-bottom: 1px solid hsl(266, 45%, 88%);
    }

    /* 返回主页按钮：默认使用你网站的高亮黄 */
    .back-btn {
      color: hsl(266, 70%, 56%); /* 主题黄 */
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s ease;
    }

    .back-btn:hover {
      opacity: 0.8;
    }

    .project-title {
      color: hsl(264, 40%, 18%);
      margin: 0;
      font-size: 16px;
      font-weight: 500;
    }

    /* PDF 播放器容器 */
    .pdf-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      background-color: hsl(266, 70%, 97%);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* night theme */
    :root[data-theme="dark"] body,
    :root[data-theme="dark"] .pdf-container { background-color: hsl(262, 45%, 5%); }
    :root[data-theme="dark"] .nav-bar { background-color: hsl(263, 32%, 10%); border-bottom-color: hsl(263, 25%, 22%); }
    :root[data-theme="dark"] .back-btn { color: hsl(268, 100%, 78%); }
    :root[data-theme="dark"] .project-title { color: hsl(0, 0%, 98%); }
  </style>
</head>
<body>

  <div class="nav-bar">
    <a href="index.html" class="back-btn">
      ←
    </a>
    <h1 class="project-title">Emotional Ecosystem</h1>
    <div style="width: 120px;"></div> 
  </div>

  <div class="pdf-container">
    <iframe src="./assets/pdf/xr.pdf" type="application/pdf"></iframe>
  </div>

</body>
</html>
